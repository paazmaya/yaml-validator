# https://docs.semaphoreci.com/reference/pipeline-yaml
version: v1.0
name: Ubuntu Based Pipeline
agent:
  machine:
    type: e1-standard-2
    # https://docs.semaphoreci.com/reference/os-ubuntu-images/ubuntu-2004-image
    os_image: ubuntu2004

blocks:
  - name: Test with Node.js v24
    task:
      prologue:
        commands:
          - checkout
          - sem-version node 24
          - cache restore node-modules-$(checksum npm-shrinkwrap.json)
          - npm ci --ignore-scripts
          - cache store node-modules-$(checksum npm-shrinkwrap.json) node_modules
      secrets:
        - name: codecov.io
      jobs:
        - name: Lint
          commands:
            - npm run lint

        - name: Unit test and coverage
          commands:
            - npm test
            - npm run coverage
            - curl -fsSL -O https://cli.codecov.io/v11.2.6/linux/codecov
            - curl -fsSL -O https://cli.codecov.io/v11.2.6/linux/codecov.SHA256SUM
            - sha256sum -c codecov.SHA256SUM
            - chmod +x codecov
            - ./codecov upload-process -t $CODECOV_TOKEN